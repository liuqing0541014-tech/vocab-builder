<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<title>生词本 · 闪卡学习</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--accent:#38bdf8;--accent2:#818cf8;--success:#34d399;--warn:#fbbf24;--danger:#f87171;--border:#334155;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
.container{max-width:900px;margin:0 auto;padding:20px}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 0;border-bottom:1px solid var(--border);margin-bottom:24px;flex-wrap:wrap;gap:12px}
header h1{font-size:1.5rem;font-weight:700;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:.9rem;transition:all .2s;background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;font-weight:600}
.btn.primary:hover{opacity:.9}
.btn.danger{background:var(--danger);color:#fff;border:none}
.btn.small{padding:4px 10px;font-size:.8rem}
.section{display:none}
.section.active{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--card);border-radius:12px;padding:20px;border:1px solid var(--border);margin-bottom:16px}
.card h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
.upload-zone{border:2px dashed var(--border);border-radius:12px;padding:40px;text-align:center;cursor:pointer;transition:all .2s}
.upload-zone:hover{border-color:var(--accent);background:rgba(56,189,248,.05)}
.upload-zone.dragover{border-color:var(--accent);background:rgba(56,189,248,.1)}
.upload-zone input[type=file]{display:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat-box{background:var(--card);border-radius:10px;padding:16px;text-align:center;border:1px solid var(--border)}
.stat-box .num{font-size:1.8rem;font-weight:700;color:var(--accent)}
.stat-box .label{font-size:.8rem;color:var(--muted);margin-top:4px}
.word-list{max-height:400px;overflow-y:auto}
.word-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:8px;background:rgba(255,255,255,.03);margin-bottom:6px;cursor:pointer;transition:all .2s;border:1px solid transparent}
.word-item:hover{background:rgba(255,255,255,.06);border-color:var(--border)}
.word-item .w{font-weight:600;font-size:1rem}
.word-item .freq{font-size:.75rem;color:var(--muted);background:rgba(255,255,255,.05);padding:2px 8px;border-radius:12px}
.word-item .diff{display:flex;gap:4px}
.badge{font-size:.65rem;padding:2px 8px;border-radius:12px;font-weight:600}
.badge.easy{background:rgba(52,211,153,.15);color:var(--success)}
.badge.medium{background:rgba(251,191,36,.15);color:var(--warn)}
.badge.hard{background:rgba(248,113,113,.15);color:var(--danger)}
.flashcard-container{perspective:1000px;max-width:560px;margin:0 auto;height:420px;position:relative}
.flashcard{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,0,.2,1);cursor:pointer}
.flashcard.flipped{transform:rotateY(180deg)}
.flashcard-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:16px;border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:var(--card)}
.flashcard-back{transform:rotateY(180deg)}
.flashcard .word{font-size:2rem;font-weight:700;margin-bottom:8px}
.flashcard .phonetic{color:var(--muted);font-size:1rem;margin-bottom:16px;font-family:Georgia,serif}
.flashcard .meaning{font-size:1.1rem;color:var(--text);margin-bottom:12px;text-align:center;line-height:1.5}
.flashcard .example{font-size:.9rem;color:var(--muted);font-style:italic;text-align:center;margin-bottom:16px;padding:0 12px}
.flashcard .image{width:240px;height:160px;border-radius:8px;object-fit:cover;margin-bottom:12px;opacity:.9}
.sentence-word{cursor:pointer;padding:1px 2px;border-radius:3px;transition:background .2s}
.sentence-word:hover{background:rgba(56,189,248,.25);color:var(--accent)}
.zh-highlight{background:rgba(251,191,36,.3);padding:1px 2px;border-radius:3px;color:var(--warn)}
.flashcard-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;justify-content:center}
.card-nav{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:20px}
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:16px 0}
.progress-bar .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s ease}
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter-bar .btn.active{background:var(--accent);color:#fff}
.review-due{color:var(--warn);font-size:.85rem}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.settings-grid{grid-template-columns:1fr}}
.setting-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.setting-item label{font-size:.9rem}
input[type=number],select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:.9rem;width:100px}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state svg{width:64px;height:64px;margin-bottom:16px;opacity:.4}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:.75rem;background:rgba(56,189,248,.1);color:var(--accent);margin-right:4px}
.toast{position:fixed;bottom:24px;right:24px;background:var(--card);border:1px solid var(--border);padding:12px 20px;border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.3);transform:translateY(100px);opacity:0;transition:all .3s ease;z-index:1000}
.toast.show{transform:translateY(0);opacity:1}
.loading{display:inline-block;width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:999;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:16px;max-width:500px;width:100%;max-height:80vh;overflow-y:auto;border:1px solid var(--border)}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-body{padding:20px}
.close-btn{background:none;border:none;color:var(--muted);font-size:1.2rem;cursor:pointer}
.sentence-item{padding:10px 0;border-bottom:1px solid var(--border);font-size:.9rem}
.sentence-item .highlight{color:var(--accent);font-weight:600}

/* ====== 搜索框 ====== */
.search-box{display:flex;gap:8px;margin-bottom:12px}
.search-box input{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:8px;font-size:.9rem}
.search-box input:focus{outline:none;border-color:var(--accent)}

/* ====== 批量操作 ====== */
.batch-toolbar{display:none;align-items:center;gap:8px;margin-bottom:12px;padding:10px 14px;background:rgba(56,189,248,.08);border-radius:8px;border:1px solid rgba(56,189,248,.2)}
.batch-toolbar.show{display:flex}
.batch-toolbar .btn{font-size:.8rem;padding:4px 10px}

/* ====== 单词选择 ====== */
.word-item{position:relative;padding-left:40px}
.word-item .chk{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:18px;height:18px;cursor:pointer;accent-color:var(--accent)}

/* ====== 详情弹窗增强 ====== */
.detail-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0;font-size:.85rem;color:var(--muted)}
.detail-meta .item{background:rgba(255,255,255,.03);padding:10px;border-radius:8px}
.detail-meta .item .val{color:var(--text);font-weight:600;margin-top:4px;font-size:1rem}
.timeline{padding:12px 0;border-left:2px solid var(--border);margin-left:8px}
.timeline-item{padding:8px 0 8px 16px;position:relative;font-size:.85rem;color:var(--muted)}
.timeline-item::before{content:"";position:absolute;left:-5px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.timeline-item .time{font-size:.75rem;color:var(--muted)}
.study-log-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:.85rem}

/* ====== 记忆曲线图表 ====== */
.memory-chart{display:flex;align-items:flex-end;gap:4px;height:120px;padding:16px;background:rgba(255,255,255,.03);border-radius:8px;margin:12px 0}
.memory-chart .bar{flex:1;background:linear-gradient(to top,var(--accent),var(--accent2));border-radius:4px 4px 0 0;min-height:4px;transition:height .3s ease}
.memory-chart .bar-label{font-size:.65rem;text-align:center;color:var(--muted);margin-top:4px}

/* ====== 来源标签 ====== */
.source-tag{display:inline-block;padding:1px 6px;border-radius:6px;font-size:.7rem;background:rgba(129,140,248,.15);color:var(--accent2);margin-left:4px}

/* ====== 全局 Loading Overlay ====== */
.loading-overlay{position:fixed;inset:0;background:rgba(15,23,42,.85);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:2000;backdrop-filter:blur(4px)}
.loading-overlay.show{display:flex}
.loading-overlay .loading-box{text-align:center;padding:40px}
.loading-overlay .loading{width:48px;height:48px;border:4px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
.loading-overlay .loading-text{color:var(--text);font-size:1.1rem;margin-bottom:8px}
.loading-overlay .loading-sub{color:var(--muted);font-size:.85rem}
.loading-overlay .progress-track{width:280px;height:6px;background:var(--border);border-radius:3px;margin-top:16px;overflow:hidden}
.loading-overlay .progress-track .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s ease;border-radius:3px}

/* ====== 确认弹窗（危险操作） ====== */
.confirm-modal .modal{max-width:420px}
.confirm-modal .modal-body{text-align:center;padding:28px 24px}
.confirm-modal .warning-icon{font-size:3rem;margin-bottom:12px}
.confirm-modal .modal-title{font-size:1.15rem;font-weight:600;margin-bottom:8px;color:var(--danger)}
.confirm-modal .modal-desc{color:var(--muted);font-size:.9rem;margin-bottom:20px;line-height:1.5}
.confirm-modal .confirm-input{width:100%;background:var(--bg);border:1px solid var(--danger);color:var(--text);padding:10px 14px;border-radius:8px;font-size:1rem;text-align:center;margin-bottom:16px}
.confirm-modal .confirm-input::placeholder{color:var(--danger);opacity:.5}
.confirm-modal .confirm-input:focus{outline:none;border-color:var(--danger)}
.confirm-modal .modal-actions{display:flex;gap:10px;justify-content:center}
.confirm-modal .modal-actions .btn{padding:10px 20px;font-size:.9rem}
.confirm-modal .modal-actions .btn.danger{background:var(--danger);color:#fff}

/* ====== 网络错误提示 ====== */
.net-error{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);border-radius:8px;padding:14px 16px;margin-top:12px;text-align:center}
.net-error .err-title{color:var(--danger);font-weight:600;font-size:.95rem;margin-bottom:6px}
.net-error .err-msg{color:var(--muted);font-size:.85rem;margin-bottom:10px}

/* ====== PDF 文件信息提示 ====== */
.pdf-info{color:var(--muted);font-size:.85rem;margin-top:8px}
.pdf-info .file-name{color:var(--accent)}
.pdf-info .file-size{color:var(--text)}

/* ====== 学习趋势折线图 ====== */
.trend-chart-container{background:var(--card);border-radius:12px;padding:16px;border:1px solid var(--border);margin-bottom:16px}
.trend-chart-container h3{font-size:1rem;color:var(--accent);margin-bottom:12px}
.trend-chart{position:relative;width:100%;height:180px}
.trend-chart svg{width:100%;height:100%}
.trend-chart .grid-line{stroke:var(--border);stroke-width:.5;stroke-dasharray:4,4}
.trend-chart .axis-text{fill:var(--muted);font-size:.65rem}
.trend-chart .line-new{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.trend-chart .line-review{fill:none;stroke:var(--warn);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.trend-chart .line-mastered{fill:none;stroke:var(--success);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.trend-chart .dot-new{fill:var(--accent);r:3}
.trend-chart .dot-review{fill:var(--warn);r:3}
.trend-chart .dot-mastered{fill:var(--success);r:3}
.trend-legend{display:flex;gap:16px;justify-content:center;margin-top:8px;font-size:.75rem;color:var(--muted)}
.trend-legend span{display:flex;align-items:center;gap:4px}
.trend-legend .dot{width:8px;height:8px;border-radius:50%;display:inline-block}

/* ====== PWA 安装提示 ====== */
.pwa-install{position:fixed;bottom:80px;right:24px;background:var(--card);border:1px solid var(--accent);border-radius:12px;padding:12px 16px;box-shadow:0 8px 32px rgba(0,0,0,.3);display:none;align-items:center;gap:10px;z-index:1001;animation:slideUp .3s ease}
.pwa-install.show{display:flex}
.pwa-install .text{font-size:.85rem;color:var(--text)}
.pwa-install .btn{padding:6px 12px;font-size:.8rem}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

</style>
</head>
<body>
<div class="container">
<header>
<h1>📚 生词本</h1>
<div class="nav">
<button class="btn primary" onclick="app.showSection('upload')">上传PDF</button>
<button class="btn" onclick="app.showSection('words')">单词库</button>
<button class="btn" onclick="app.showSection('study')">学习</button>
<button class="btn" onclick="app.showSection('review')">复习</button>
<button class="btn" onclick="app.showSection('settings')">设置</button>
</div>
</header>

<!-- 上传 -->
<div id="sec-upload" class="section active">
<div class="card">
<h2>📄 上传PDF提取生词</h2>
<div style="text-align:center;margin-bottom:12px"><button class="btn primary" onclick="app.loadPrebuilt()">📚 加载ACSΜ预置词库</button></div><div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
<input type="file" id="fileInput" accept=".pdf" onchange="app.handleFile(event)">
<div>📁 点击或拖拽PDF文件到此处</div>
<div style="color:var(--muted);font-size:.85rem;margin-top:8px">自动提取高频词并过滤常用词</div>
</div>
<div id="parseStatus" style="margin-top:12px;display:none">
<span class="loading"></span> <span id="parseText">正在解析...</span>
</div>
<div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border)">
<h3 style="font-size:1rem;margin-bottom:8px;color:var(--accent)">🌐 粘贴网页/文本内容</h3>
<textarea id="textInput" placeholder="直接粘贴网页文字、文章段落或HTML代码..." style="width:100%;min-height:120px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:.9rem;resize:vertical"></textarea>
<div style="margin-top:8px;text-align:center">
<button class="btn primary" onclick="app.extractFromText()">🔍 提取生词</button>
</div>
</div>
</div>
<div class="stats" id="uploadStats"></div>
</div>

<!-- 单词库 -->
<div id="sec-words" class="section">
<div class="stats" id="wordStats"></div>
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
<h2>单词列表</h2>
<div class="filter-bar">
<button class="btn small active" onclick="app.filterWords('all')">全部</button>
<button class="btn small" onclick="app.filterWords('new')">未学</button>
<button class="btn small" onclick="app.filterWords('learning')">学习中</button>
<button class="btn small" onclick="app.filterWords('mastered')">已掌握</button>
</div>
</div>
<!-- 搜索框 -->
<div class="search-box">
<input type="text" id="wordSearch" placeholder="搜索单词..." oninput="app.searchWords(this.value)">
<button class="btn small" onclick="app.clearSearch()">清除</button>
</div>
<!-- 批量操作栏 -->
<div class="batch-toolbar" id="batchToolbar">
<span id="batchCount">已选 0 个</span>
<button class="btn danger small" onclick="app.batchDelete()">删除</button>
<button class="btn small" onclick="app.batchMarkMastered()">标为已掌握</button>
<button class="btn small" onclick="app.batchMarkLearning()">标为学习中</button>
<button class="btn small" onclick="app.clearSelection()">取消选择</button>
</div>
<div class="word-list" id="wordList"></div>
</div>
</div>

<!-- 学习 -->
<div id="sec-study" class="section">
<div class="card">
<h2>🎯 今日新词学习</h2>
<div class="progress-bar"><div class="fill" id="studyProgress" style="width:0%"></div></div>
<div id="studyEmpty" class="empty-state">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
<div>今日新词学习任务已完成，或尚未上传PDF</div>
</div>
<div id="studyCardArea" style="display:none">
<div class="flashcard-container">
<div class="flashcard" id="flashcard" onclick="app.flipCard()">
<div class="flashcard-face flashcard-front">
<img class="image" id="cardImg" src="" alt="" style="display:none">
<div class="word" id="cardWord"></div>
<div class="phonetic" id="cardPhonetic"></div>
<button class="btn small" onclick="event.stopPropagation();app.speak()">🔊 发音</button>
<div style="color:var(--muted);font-size:.8rem;margin-top:12px">点击翻转查看释义</div>
</div>
<div class="flashcard-face flashcard-back">
<div class="word" id="cardWordBack"></div>
<div class="meaning" id="cardMeaning"></div>
<div class="example" id="cardExample"></div>
<div style="font-size:.8rem;color:var(--muted)">难度: <span id="cardDiff"></span></div>
</div>
</div>
</div>
<div class="card-nav">
<button class="btn" onclick="app.prevCard()">← 上一个</button>
<span id="cardCounter" style="color:var(--muted);font-size:.9rem"></span>
<button class="btn" onclick="app.nextCard()">下一个 →</button>
</div>
<div class="flashcard-actions">
<button class="btn danger small" onclick="app.markCard('hard')">😰 太难</button>
<button class="btn small" onclick="app.markCard('again')">🔄 再学一次</button>
<button class="btn primary small" onclick="app.markCard('good')">✅ 记住了</button>
<button class="btn small" style="background:var(--success);color:#fff" onclick="app.markCard('easy')">🌟 太简单</button>
</div>
</div>
</div>
</div>

<!-- 复习 -->
<div id="sec-review" class="section">
<div class="card">
<h2>🔄 间隔复习</h2>
<div id="reviewEmpty" class="empty-state">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
<div>今日没有待复习的单词</div>
</div>
<div id="reviewArea" style="display:none">
<div class="flashcard-container">
<div class="flashcard" id="reviewCard" onclick="app.flipReviewCard()">
<div class="flashcard-face flashcard-front">
<img class="image" id="reviewImg" src="" alt="" style="display:none">
<div class="word" id="reviewWord"></div>
<button class="btn small" onclick="event.stopPropagation();app.speakReview()">🔊 发音</button>
<div style="color:var(--muted);font-size:.8rem;margin-top:12px">点击翻转</div>
</div>
<div class="flashcard-face flashcard-back">
<div class="word" id="reviewWordBack"></div>
<div class="meaning" id="reviewMeaning"></div>
<div class="example" id="reviewExample"></div>
<div class="review-due" id="reviewDue"></div>
</div>
</div>
</div>
<div class="card-nav">
<button class="btn" onclick="app.prevReview()">←</button>
<span id="reviewCounter"></span>
<button class="btn" onclick="app.nextReview()">→</button>
</div>
<div class="flashcard-actions">
<button class="btn danger small" onclick="app.rateReview('again')">❌ 忘记</button>
<button class="btn small" onclick="app.rateReview('hard')">😰 困难</button>
<button class="btn primary small" onclick="app.rateReview('good')">✅ 记得</button>

function getInlineTranslation(word){const w=word.toLowerCase();if(INLINE_DICT[w])return INLINE_DICT[w];return null}

function lemmatize(w){const lw=w.toLowerCase();if(IRREGULAR[lw])return IRREGULAR[lw];if(lw==="versus")return"versus";if(lw.endsWith("ies")&&lw.length>4)return lw.slice(0,-3)+"y";if(lw.endsWith("ves"))return lw.slice(0,-3)+"f";if(lw.endsWith("s")&&!lw.endsWith("ss")&&lw.length>3&&!lw.endsWith("sis"))return lw.slice(0,-1);if(lw.endsWith("ied"))return lw.slice(0,-3)+"y";if(lw.endsWith("ed")&&lw.length>3){let s=lw.slice(0,-2);if(s.endsWith("i"))return s.slice(0,-1)+"y";if(s.endsWith("c"))return s+"e";return s}if(lw.endsWith("ing")&&lw.length>5){let s=lw.slice(0,-3);if(s.endsWith("y"))return s;if(s.length>2&&s.slice(-1)!=="e"&&/[aeiou]/.test(s.slice(-2,-1))&&/[^aeiou]/.test(s.slice(-1))&&s.length<=4)return s+"e";return s}return lw}

// ============== 难度分级 ==============
function getDifficulty(freq,word){const w=word.toLowerCase();const len=w.length;const isAcademic=AWL.has(w)||AWL.has(lemmatize(w));if(len>=12)return"hard";if(isAcademic&&len>=8)return"hard";if(isAcademic&&len>=5)return"medium";if(len<=4)return"easy";if(freq>=30&&len<=6)return"easy";if(freq>=8)return"medium";if(len>=10)return"hard";return"medium"}

// ============== 艾宾浩斯间隔（分钟）==============
const SRS_INTERVALS={again:1,hard:Math.round(24*60*0.5),good:24*60,easy:24*60*3}; // 1分钟,12小时,1天,3天
function getNextInterval(card,quality){const now=Date.now();const iv=card.interval||0;const ef=card.easeFactor||2.5;let nInterval,nEF;if(quality==="again"){nInterval=SRS_INTERVALS.again;nEF=Math.max(1.3,ef-0.2)}else if(quality==="hard"){nInterval=Math.max(SRS_INTERVALS.hard,Math.round(iv*1.2));nEF=Math.max(1.3,ef-0.15)}else if(quality==="good"){nInterval=iv===0?SRS_INTERVALS.good:Math.round(iv*ef);nEF=ef}else{nInterval=iv===0?SRS_INTERVALS.easy:Math.round(iv*ef*1.3);nEF=ef+0.15}return{interval:nInterval,easeFactor:Math.max(1.3,nEF),due:now+nInterval*60*1000,reviewCount:(card.reviewCount||0)+1}}

// ============== 应用主类 ==============
class VocabApp{constructor(){this.words={};this.sentences=[];this.settings={dailyNew:10,dailyReview:30,autoSpeak:"off",showImage:"on",translateEngine:"mymemory",extractCount:300};this.studyQueue=[];this.reviewQueue=[];this.currentStudy=0;this.currentReview=0;this.filter="all";this.pdfText="";this.searchQuery="";this.selectedWords=new Set();this.studyLog=[];this.pdfSource="";this.pendingConfirm=null;this.pendingFile=null;this.loadData();this.initDragDrop();this.renderStats();this.registerSW()}
loadData(){const d=localStorage.getItem("vocabData");if(d){const o=JSON.parse(d);this.words=o.words||{};this.sentences=o.sentences||[];this.studyLog=o.studyLog||[];this.pdfSource=o.pdfSource||"";this.settings={...this.settings,...o.settings};document.getElementById("dailyNew").value=this.settings.dailyNew;document.getElementById("dailyReview").value=this.settings.dailyReview;document.getElementById("autoSpeak").value=this.settings.autoSpeak;document.getElementById("showImage").value=this.settings.showImage;if(document.getElementById("translateEngine"))document.getElementById("translateEngine").value=this.settings.translateEngine||"mymemory";if(document.getElementById("extractCount"))document.getElementById("extractCount").value=this.settings.extractCount||300;this.renderStats()}else if(typeof PREBUILT_VOCAB!=="undefined"&&PREBUILT_VOCAB.words){this.words=PREBUILT_VOCAB.words||{};this.sentences=PREBUILT_VOCAB.sentences||[];this.studyLog=[];this.pdfSource=PREBUILT_VOCAB.pdfSource||"ACSM_test.pdf";this.settings={...this.settings,...PREBUILT_VOCAB.settings};document.getElementById("dailyNew").value=this.settings.dailyNew;document.getElementById("dailyReview").value=this.settings.dailyReview;document.getElementById("autoSpeak").value=this.settings.autoSpeak;document.getElementById("showImage").value=this.settings.showImage;if(document.getElementById("extractCount"))document.getElementById("extractCount").value=this.settings.extractCount||300;this.saveData();this.showToast("已加载ACSΜ预置词库（"+Object.keys(this.words).length+"词）");this.renderStats()}}
saveData(){localStorage.setItem("vocabData",JSON.stringify({words:this.words,sentences:this.sentences,settings:this.settings,studyLog:this.studyLog,pdfSource:this.pdfSource}))}
showSection(id){document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));document.getElementById("sec-"+id).classList.add("active");if(id==="words")this.renderWordList();if(id==="study")this.initStudy();if(id==="review")this.initReview();if(id==="settings"){this.renderLearningStats();this.renderStudyLog()}}
initDragDrop(){const z=document.getElementById("uploadZone");["dragenter","dragover","dragleave","drop"].forEach(e=>{z.addEventListener(e,evt=>{evt.preventDefault();evt.stopPropagation()})});z.addEventListener("dragenter",()=>z.classList.add("dragover"));z.addEventListener("dragleave",()=>z.classList.remove("dragover"));z.addEventListener("drop",e=>{z.classList.remove("dragover");const f=e.dataTransfer.files[0];if(f&&f.name.endsWith(".pdf"))this.parsePDF(f)})}
handleFile(e){const f=e.target.files[0];if(f)this.parsePDF(f)}

extractFromText(){const text=document.getElementById("textInput").value.trim();if(!text){this.showToast("请先粘贴内容");return}this.pdfSource="粘贴文本";this.pdfText=text;this.extractWords(text,"粘贴文本");this.extractSentences(text);this.saveData();this.showToast(`已提取 ${Object.keys(this.words).length} 个生词`);this.renderStats();this.renderWordList();document.getElementById("textInput").value=""}
async parsePDF(file){
const MAX_SIZE=500*1024*1024;
if(file.size>MAX_SIZE){this.showToast("PDF超过500MB限制，请拆分后上传");return}
this.pendingFile=file;
document.getElementById("pdfError").style.display="none";
this.showLoading("解析PDF中...",file.name+" ("+(file.size/1024/1024).toFixed(1)+"MB)",0);
try{pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const buf=await file.arrayBuffer();
const pdf=await pdfjsLib.getDocument({data:buf}).promise;
let full="";
for(let i=1;i<=pdf.numPages;i++){this.showLoading(`解析第 ${i}/${pdf.numPages} 页...`,file.name,Math.round((i/pdf.numPages)*100));const page=await pdf.getPage(i);const txtCont=await page.getTextContent();full+=txtCont.items.map(x=>x.str).join(" ")+"\n"}
this.pdfText=full;this.pdfSource=file.name;this.extractWords(full,file.name);this.extractSentences(full);this.saveData();this.showToast(`已提取 ${Object.keys(this.words).length} 个生词`);this.renderStats();this.renderWordList();}catch(err){console.error(err);
const errBox=document.getElementById("pdfError");errBox.style.display="block";errBox.querySelector(".err-title").textContent="PDF解析失败";errBox.querySelector(".err-msg").textContent=err.message||"文件可能损坏或格式不支持";this.pendingFile=file;
}finally{this.hideLoading()}}

extractWords(text,source=""){const words=text.match(/\b[a-zA-Z]{2,}\b/g)||[];const freq={};words.forEach(w=>{const lw=w.toLowerCase();if(STOP_WORDS.has(lw)||STOP_WORDS.has(lemmatize(lw)))return;if(ABBREVS.has(lw)||ABBREVS.has(lemmatize(lw)))return;const base=lemmatize(lw);freq[base]=(freq[base]||0)+1});const domCount=parseInt(document.getElementById("extractCount")?.value)||0;const limit=domCount||this.settings.extractCount||300;const sorted=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,limit);sorted.forEach(([w,f])=>{if(!this.words[w]){this.words[w]={word:w,freq:f,diff:getDifficulty(f,w),status:"new",created:Date.now(),translations:[],example:"",interval:0,easeFactor:2.5,due:0,reviewCount:0,pdfSource:source}}})}

renderLearningStats(){const keys=Object.keys(this.words);const total=keys.length;const mastered=keys.filter(k=>this.words[k].status==="mastered").length;const learning=keys.filter(k=>this.words[k].status==="learning").length;const neww=keys.filter(k=>this.words[k].status==="new").length;const todayReviewed=keys.filter(k=>{const w=this.words[k];return w.lastStudy&&Date.now()-w.lastStudy<86400000&&w.status==="learning"}).length;document.getElementById("learningStats").innerHTML=[{n:total,l:"总词数"},{n:neww,l:"未学"},{n:learning,l:"学习中"},{n:mastered,l:"已掌握"},{n:todayReviewed,l:"今日复习"}].map(s=>`<div class="stat-box"><div class="num">${s.n}</div><div class="label">${s.l}</div></div>`).join("");this.renderTrendChart()}

renderTrendChart(){const container=document.getElementById("trendChartContainer");if(this.studyLog.length===0){container.style.display="block";container.innerHTML=`<div class="trend-chart-container"><h3>📈 学习趋势（近14天）</h3><div style="text-align:center;padding:40px 20px;color:var(--muted);font-size:.9rem">暂无学习记录<br>开始学习或复习后，将自动显示趋势图</div></div>`;return}container.style.display="block";const days=14;const today=new Date();today.setHours(0,0,0,0);const dates=[];for(let i=days-1;i>=0;i--){const d=new Date(today);d.setDate(d.getDate()-i);dates.push(d.toLocaleDateString("zh-CN",{month:"numeric",day:"numeric"}))}const data={new:Array(days).fill(0),review:Array(days).fill(0),mastered:Array(days).fill(0)};this.studyLog.forEach(l=>{const d=new Date(l.timestamp);d.setHours(0,0,0,0);const diff=Math.floor((today-d)/86400000);if(diff>=0&&diff<days){if(l.action==="new")data.new[days-1-diff]++;else if(l.action==="review")data.review[days-1-diff]++;else if(l.action==="mastered")data.mastered[days-1-diff]++}});const maxVal=Math.max(1,...data.new,...data.review,...data.mastered);const w=800,h=180,padding={top:20,right:20,bottom:30,left:30};const chartW=w-padding.left-padding.right;const chartH=h-padding.top-padding.bottom;const xStep=chartW/(days-1);const makePath=(arr)=>{let p="";arr.forEach((v,i)=>{const x=padding.left+i*xStep;const y=padding.top+chartH-(v/maxVal)*chartH;if(i===0)p+=`M${x},${y}`;else p+=` L${x},${y}`});return p};const makeDots=(arr,cls)=>arr.map((v,i)=>{const x=padding.left+i*xStep;const y=padding.top+chartH-(v/maxVal)*chartH;if(v===0)return"";return`<circle cx="${x}" cy="${y}" class="dot-${cls}"/>`}).join("");const gridY=[0,0.25,0.5,0.75,1].map(r=>{const y=padding.top+chartH*(1-r);return`<line x1="${padding.left}" y1="${y}" x2="${w-padding.right}" y2="${y}" class="grid-line"/>`}).join("");const xLabels=dates.map((d,i)=>{const x=padding.left+i*xStep;return`<text x="${x}" y="${h-8}" text-anchor="middle" class="axis-text">${d}</text>`}).join("");const yLabels=[0,Math.ceil(maxVal/2),maxVal].map(v=>{const y=padding.top+chartH-(v/maxVal)*chartH;return`<text x="${padding.left-6}" y="${y+3}" text-anchor="end" class="axis-text">${v}</text>`}).join("");container.innerHTML=`<div class="trend-chart-container"><h3>📈 学习趋势（近14天）</h3><div class="trend-chart"><svg viewBox="0 0 ${w} ${h}">${gridY}${yLabels}${xLabels}<path d="${makePath(data.new)}" class="line-new"/><path d="${makePath(data.review)}" class="line-review"/><path d="${makePath(data.mastered)}" class="line-mastered"/>${makeDots(data.new,"new")}${makeDots(data.review,"review")}${makeDots(data.mastered,"mastered")}</svg></div><div class="trend-legend"><span><span class="dot" style="background:var(--accent)"></span>新学</span><span><span class="dot" style="background:var(--warn)"></span>复习</span><span><span class="dot" style="background:var(--success)"></span>已掌握</span></div></div>`;}

loadPrebuilt(){this.showConfirm("加载预置词库将覆盖当前数据","此操作会清空当前所有单词、例句和学习记录，且不可恢复。输入 DELETE 确认。","⚠️",()=>{this.showLoading("加载预置词库...");setTimeout(()=>{if(typeof PREBUILT_VOCAB!=="undefined"&&PREBUILT_VOCAB.words){this.words=PREBUILT_VOCAB.words||{};this.sentences=PREBUILT_VOCAB.sentences||[];this.studyLog=[];this.pdfSource=PREBUILT_VOCAB.pdfSource||"ACSM_test.pdf";this.settings={...this.settings,...PREBUILT_VOCAB.settings};this.saveData();this.hideLoading();this.showToast("已加载ACSΜ预置词库（"+Object.keys(this.words).length+"词）");this.renderStats();this.renderWordList()}else{this.hideLoading();this.showToast("预置词库不可用")}},300)})}clearAll(){this.showConfirm("清空所有数据","此操作将永久删除所有单词、例句、学习记录和设置，不可恢复。输入 DELETE 确认。","🗑️",()=>{this.words={};this.sentences=[];this.studyLog=[];this.pdfSource="";this.selectedWords.clear();this.saveData();this.showToast("数据已清空");this.renderStats();this.renderWordList();document.getElementById("studyLogCard").style.display="none"})}
exportData(){const blob=new Blob([JSON.stringify({words:this.words,sentences:this.sentences,settings:this.settings,studyLog:this.studyLog,pdfSource:this.pdfSource},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="vocab-backup-"+new Date().toISOString().slice(0,10)+".json";a.click()}
importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const o=JSON.parse(ev.target.result);if(o.words)this.words=o.words;if(o.sentences)this.sentences=o.sentences;if(o.settings)this.settings={...this.settings,...o.settings};if(document.getElementById("extractCount"))document.getElementById("extractCount").value=this.settings.extractCount||300;if(o.studyLog)this.studyLog=o.studyLog||[];if(o.pdfSource)this.pdfSource=o.pdfSource||"";this.saveData();this.showToast(`导入成功，共 ${Object.keys(this.words).length} 个单词`);this.renderStats()}catch(err){this.showToast("导入失败: "+err.message)}};r.readAsText(f)}
searchWords(q){this.searchQuery=q;this.renderWordList()}
clearSearch(){this.searchQuery="";document.getElementById("wordSearch").value="";this.renderWordList()}
toggleSelect(word){if(this.selectedWords.has(word))this.selectedWords.delete(word);else this.selectedWords.add(word);this.renderWordList()}
clearSelection(){this.selectedWords.clear();this.renderWordList()}
batchDelete(){if(!confirm(`确定删除选中的 ${this.selectedWords.size} 个单词吗？`))return;const count=this.selectedWords.size;this.selectedWords.forEach(w=>{delete this.words[w]});this.selectedWords.clear();this.saveData();this.renderWordList();this.showToast(`已删除 ${count} 个单词`)}
batchMarkMastered(){this.selectedWords.forEach(w=>{if(this.words[w])this.words[w].status="mastered"});this.selectedWords.clear();this.saveData();this.renderWordList();this.showToast("已标记为已掌握")}
batchMarkLearning(){this.selectedWords.forEach(w=>{if(this.words[w])this.words[w].status="learning"});this.selectedWords.clear();this.saveData();this.renderWordList();this.showToast("已标记为学习中")}
playAudio(word){return new Promise((resolve,reject)=>{const audio=new Audio(`https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(word)}&type=2`);audio.oncanplaythrough=()=>resolve(audio);audio.onerror=(e)=>reject(e);audio.play().catch(e=>reject(e));})}
speakWord(word){if(window.speechSynthesis){window.speechSynthesis.cancel();window.speechSynthesis.resume();setTimeout(()=>{const u=new SpeechSynthesisUtterance('\u200B'+word);u.lang="en-US";u.rate=.9;try{const voices=window.speechSynthesis.getVoices();const enVoice=voices.find(v=>v.lang.startsWith("en"));if(enVoice)u.voice=enVoice}catch(e){}window.speechSynthesis.speak(u)},1200)}else{this.playAudio(word).catch(()=>this.showToast("语音播放失败，请检查网络"))}}
deleteWord(word){if(!confirm(`确定删除单词 "${word}" 吗？`))return;delete this.words[word];this.selectedWords.delete(word);this.saveData();document.getElementById("wordDetailModal").classList.remove("show");this.renderWordList();this.showToast("已删除")}
quickReview(word){document.getElementById("wordDetailModal").classList.remove("show");const w=this.words[word];if(!w)return;if(w.status==="mastered"){w.status="learning";this.showToast("已重置为学习中")}this.showSection("review");this.initReview()}
renderStudyLog(){const card=document.getElementById("studyLogCard");const list=document.getElementById("studyLogList");if(this.studyLog.length===0){card.style.display="none";return}card.style.display="block";const byDate={};this.studyLog.slice().reverse().forEach(l=>{const date=new Date(l.timestamp).toLocaleDateString("zh-CN");if(!byDate[date])byDate[date]=[];byDate[date].push(l)});list.innerHTML=Object.entries(byDate).slice(0,7).map(([date,logs])=>`<div style="margin-bottom:12px"><div style="font-weight:600;color:var(--accent);font-size:.9rem;margin-bottom:6px">${date}</div>${logs.slice(0,10).map(l=>`<div class="study-log-item"><span>${l.word}</span><span style="color:var(--muted)">${l.action==="review"?"复习":l.action==="mastered"?"已掌握":l.action==="new"?"新学":l.action} ${l.quality?"("+l.quality+")":""}</span></div>`).join("")}${logs.length>10?`<div style="color:var(--muted);font-size:.75rem;text-align:center">+${logs.length-10} 条...</div>`:""}</div>`).join("")}
async loadWikiImage(img,word){try{const r=await this.fetchWithTimeout(`https://en.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(word)}&prop=pageimages&format=json&pithumbsize=300&origin=*`,{},4000);const d=await r.json();const pages=d.query.pages;const page=Object.values(pages)[0];if(page&&page.thumbnail&&page.thumbnail.source){img.src=page.thumbnail.source;img.style.display="block"}else{img.style.display="none"}}catch(e){img.style.display="none"}}showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2500)}

// ====== 全局 Loading ======
showLoading(text,sub,progress){const ov=document.getElementById("globalLoading");document.getElementById("loadingText").textContent=text||"处理中...";document.getElementById("loadingSub").textContent=sub||"";const bar=document.getElementById("loadingProgress");if(progress!==undefined){bar.parentElement.style.display="block";bar.style.width=progress+"%"}else{bar.parentElement.style.display="none"}ov.classList.add("show")}
hideLoading(){document.getElementById("globalLoading").classList.remove("show")}

// ====== 危险操作确认弹窗 ======
showConfirm(title,desc,icon,callback){this.pendingConfirm=callback;document.getElementById("confirmTitle").textContent=title;document.getElementById("confirmDesc").textContent=desc;document.getElementById("confirmIcon").textContent=icon||"⚠️";document.getElementById("confirmInput").value="";document.getElementById("confirmModal").classList.add("show");document.getElementById("confirmInput").focus()}
cancelConfirm(){this.pendingConfirm=null;document.getElementById("confirmModal").classList.remove("show")}
execConfirm(){const input=document.getElementById("confirmInput").value.trim();if(input!=="DELETE"){this.showToast("请输入 DELETE 以确认操作");document.getElementById("confirmInput").focus();return}document.getElementById("confirmModal").classList.remove("show");if(this.pendingConfirm){const cb=this.pendingConfirm;this.pendingConfirm=null;try{cb()}catch(e){console.error(e)}}}

// ====== 重试方法 ======
registerSW(){if(!("serviceWorker" in navigator))return;const swCode=`self.addEventListener("install",e=>{self.skipWaiting()});self.addEventListener("activate",e=>{e.waitUntil(self.clients.claim())});self.addEventListener("fetch",e=>{e.respondWith(fetch(e.request).catch(()=>new Response("离线模式")))});`;const blob=new Blob([swCode],{type:"application/javascript"});const swUrl=URL.createObjectURL(blob);navigator.serviceWorker.register(swUrl).then(reg=>{console.log("SW registered")}).catch(err=>{console.log("SW failed",err)});window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();this.deferredPrompt=e;const btn=document.getElementById("pwaInstall");if(btn)btn.classList.add("show")})}installPWA(){if(!this.deferredPrompt){this.showToast("您的浏览器不支持安装或已安装");return}this.deferredPrompt.prompt();this.deferredPrompt.userChoice.then(choice=>{if(choice.outcome==="accepted"){this.showToast("已添加到桌面");document.getElementById("pwaInstall").classList.remove("show")}this.deferredPrompt=null})}
retryPDF(){document.getElementById("pdfError").style.display="none";if(this.pendingFile){this.parsePDF(this.pendingFile)}}
retryTranslate(){document.getElementById("netError").style.display="none";this.renderStudyCard()}getContextTranslation(word,sentences){if(!sentences||sentences.length===0)return"";const s=sentences[0];const zh=s.zh||"";if(!zh)return"";const lw=word.toLowerCase();const variants=[lw];const base=lemmatize(lw);if(base!==lw)variants.push(base);const suffixes=["s","es","ed","ing","tion","ation","er","or","ment","ness","ly","ive","al","ic","ous"];suffixes.forEach(sfx=>{variants.push(base+sfx);if(base.endsWith("e")&&sfx.startsWith("i"))variants.push(base.slice(0,-1)+sfx)});if(base.endsWith("y"))variants.push(base.slice(0,-1)+"ies");for(const v of variants){const re=new RegExp(`(^|[^\\u4e00-\\u9fa5])${this.escapeRegExp(v)}($|[^\\u4e00-\\u9fa5])`,'i');if(re.test(zh))return"例句中翻译为："+zh}const phrases=["训练","运动","肌肉","力量","强度","速度","耐力","功率","收缩","肥大","阻力","处方","健康","身体","功能","活动","恢复","适应","代谢","骨骼","关节","神经","心血管","呼吸","内分泌","免疫","炎症","氧化","应激","损伤","疼痛","疲劳","柔韧","平衡","协调","敏捷","爆发","核心","稳定","姿势","步态","姿势","体位","动作","模式","表现","能力","水平","效果","益处","风险","安全","标准","指南","建议","原则","方法","策略","技术","设备","器械","负荷","重量","强度","量","次数","组数","频率","周期","阶段","进阶","退阶","变量","参数","指标","测量","评估","测试","筛查","诊断","预后","干预","治疗","康复","预防","促进","维持","改善","提高","增强","降低","减少","增加","变化","差异","相关","影响","作用","机制","过程","反应","适应","变化","发展","趋势","模式","类型","分类","等级","程度","范围","领域","方面","因素","特征","特点","属性","性质","状态","条件","环境","背景","情境","场景","情况","问题","挑战","障碍","限制","困难","需求","目标","目的","意义","价值","重要性","必要性","可行性","有效性","可靠性","准确性","精确性","敏感性","特异性","重复性","一致性","稳定性","变异性","普遍性","代表性","适用性","实用性","操作性","可及性","接受性","满意度","依从性"," adherence"," compliance"," adherence"];for(const ph of phrases){if(zh.includes(ph)){const idx=zh.indexOf(ph);const before=zh.slice(Math.max(0,idx-10),idx);const after=zh.slice(idx+ph.length,idx+ph.length+10);if(before.includes(word)||after.includes(word))continue;const context=before+"【"+ph+"】"+after;return"例句语境：..."+context+"..."}}return"例句翻译："+zh}escapeRegExp(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}editTranslation(word){const w=this.words[word];if(!w)return;const current=w.translations.join("; ")||"";const newTrans=prompt(`编辑 "${word}" 的翻译：`,current);if(newTrans===null)return;w.translations=newTrans.split(/[,;；]/).map(t=>t.trim()).filter(t=>t);this.saveData();const el=document.getElementById("detailTrans");if(el)el.textContent=w.translations.join("; ");this.showToast("翻译已更新");this.renderWordList()}clearTranslationCache(){if(!confirm("确定清除所有翻译缓存吗？单词列表会保留，但翻译需要重新获取。"))return;Object.values(this.words).forEach(w=>{w.translations=[]});this.sentences.forEach(s=>{s.zh=""});this.saveData();this.showToast("翻译缓存已清除");this.renderWordList()}buildInteractiveSentence(en,zh,targetWord){if(!en)return"";const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");const parts=en.split(/(\b[a-zA-Z']+\b)/g);const enHtml=parts.map(p=>{if(/^[a-zA-Z]+$/.test(p)){const lw=p.toLowerCase();if(STOP_WORDS.has(lw)||p.length<2)return esc(p);const cls=lw===targetWord?"sentence-word highlight":"sentence-word";return`<span class="${cls}" data-word="${lw}" onmouseover="app.hoverWord(this)" onmouseout="app.unhoverWord(this)">${esc(p)}</span>`}return esc(p)}).join("");return`<div class="en-line">${enHtml}</div>${zh?`<div class="zh-line">${esc(zh)}</div>`:""}`}hoverWord(el){el.classList.add("hovered");const word=el.dataset.word;const parent=el.closest(".en-line");if(!parent)return;const zhEl=parent.parentElement.querySelector(".zh-line");if(!zhEl)return;if(!zhEl.dataset.origText)zhEl.dataset.origText=zhEl.textContent;const w=this.words[word];const sens=this.findSentences(word);const zhText=zhEl.dataset.origText;let candidates=[];
if(w&&w.translations&&w.translations.length>0){for(const t of w.translations){if(t&&t.length>=2&&t!=="翻译加载中..."&&t!=="翻译失败，请联网")candidates.push({text:t,score:100})}}
if(sens.length>0&&sens[0].zh){let ctx=sens[0].zh;const prefixes=["我们需要","运动员需要","患者需要","运动员","患者","我们","该","这","研究","训练","本文","报告","表明","指出","认为"];for(const p of prefixes){if(ctx.startsWith(p)){ctx=ctx.slice(p.length).trim();break}}ctx=ctx.replace(/^[,.;，。！？\s]+/,"");if(ctx&&ctx.length>=2)candidates.push({text:ctx,score:90})}
const inline=getInlineTranslation(word);if(inline&&inline.length>=2)candidates.push({text:inline,score:70});
const seen=new Set();candidates=candidates.filter(c=>{if(seen.has(c.text))return false;seen.add(c.text);return true});
function tokenizeChinese(text){return text.split(/([\u4e00-\u9fa5]+|[a-zA-Z]+|\d+|[^\u4e00-\u9fa5a-zA-Z\d]+)/).filter(t=>t&&t.trim())}
function findBestMatch(source){const tokens=tokenizeChinese(source);let best={idx:-1,len:0,score:0,text:""};for(const c of candidates){const txt=c.text;let candidateScore=c.score;
for(let i=0;i<tokens.length;i++){let combined="";let j=i;while(j<tokens.length&&combined.length<txt.length+4){combined+=tokens[j];j++}if(combined.includes(txt)){const idx=source.indexOf(txt);if(idx>=0){const len=txt.length;const wholeWordBonus=combined===txt?20:10;const lenBonus=Math.min(len*2,30);if(idx+len>best.idx+best.len||candidateScore+wholeWordBonus+lenBonus>best.score){best={idx:idx,len:len,score:candidateScore+wholeWordBonus+lenBonus,text:txt}}}break}}
if(best.idx<0){const idx=source.indexOf(txt);if(idx>=0){const len=txt.length;const lenBonus=Math.min(len,20);if(candidateScore+lenBonus>best.score){best={idx:idx,len:len,score:candidateScore+lenBonus,text:txt}}}}}
return best}
const best=findBestMatch(zhText);
if(best.idx>=0){const before=zhText.slice(0,best.idx);const match=zhText.slice(best.idx,best.idx+best.len);const after=zhText.slice(best.idx+best.len);zhEl.innerHTML=`${before}<span class="zh-highlight">${match}</span>${after}`}}
unhoverWord(el){el.classList.remove("hovered");const parent=el.closest(".en-line");if(!parent)return;const zhEl=parent.parentElement.querySelector(".zh-line");if(zhEl&&zhEl.dataset.origText){zhEl.textContent=zhEl.dataset.origText;delete zhEl.dataset.origText}}

}
